name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        # actions/checkout v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.0.0
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned build and test tools
        run: >-
          python -m pip install
          "hatchling==1.27.0"
          "editables==0.5"
          "rich==15.0.0"
          "typer==0.27.0"
          "pytest==8.4.2"
          "ruff==0.16.2"

      - name: Install package without dependency re-resolution
        run: python -m pip install --no-build-isolation --no-deps -e .

      - name: Run tests
        run: python -m pytest

  quality:
    name: Lint and formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"

      - name: Install pinned build and quality tools
        run: >-
          python -m pip install
          "hatchling==1.27.0"
          "editables==0.5"
          "rich==15.0.0"
          "typer==0.27.0"
          "ruff==0.16.2"

      - name: Install package without dependency re-resolution
        run: python -m pip install --no-build-isolation --no-deps -e .

      - name: Run lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .
