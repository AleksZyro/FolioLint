name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned build and test tools
        run: >-
          python -m pip install
          "hatchling==1.27.0"
          "rich==15.0.0"
          "typer==0.27.0"
          "pytest==8.4.2"
          "ruff==0.16.2"

      - name: Install package without dependency re-resolution
        run: python -m pip install --no-build-isolation --no-deps -e .

      - name: Run tests
        run: python -m pytest

  quality:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned build and quality tools
        run: >-
          python -m pip install
          "hatchling==1.27.0"
          "rich==15.0.0"
          "typer==0.27.0"
          "ruff==0.16.2"

      - name: Install package without dependency re-resolution
        run: python -m pip install --no-build-isolation --no-deps -e .

      - name: Run lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .
