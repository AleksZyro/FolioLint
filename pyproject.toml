[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foliolint"
version = "0.1.0"
description = "Local Python CLI for GitHub portfolio linting and repository showcase readiness checks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FolioLint contributors" }]
keywords = ["portfolio", "github", "readme", "cli", "linter", "repository-hygiene", "showcase-readiness"]
dependencies = [
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
foliolint = "foliolint.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/foliolint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
