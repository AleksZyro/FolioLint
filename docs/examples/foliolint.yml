name: FolioLint showcase check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  showcase:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"

      - name: Install FolioLint
        # Pin the tool source to the reviewed commit. Update deliberately when upgrading FolioLint.
        run: python -m pip install --no-deps "git+https://github.com/AleksZyro/FolioLint.git@8f28829"

      - name: Install pinned runtime dependencies
        run: python -m pip install "rich==15.0.0" "typer==0.27.0"

      - name: Run FolioLint
        run: foliolint scan . --format markdown --output foliolint-report.md --fail-under 75

      - name: Add report to job summary
        if: always()
        run: Get-Content foliolint-report.md >> $env:GITHUB_STEP_SUMMARY
        shell: pwsh
