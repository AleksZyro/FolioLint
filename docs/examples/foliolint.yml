name: FolioLint showcase check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install FolioLint
        # Pin the tool source to the reviewed commit. Update deliberately when upgrading FolioLint.
        run: python -m pip install --no-deps "git+https://github.com/AleksZyro/FolioLint.git@0848d4c6a40baf0e8becbbe369e5f8f1cc5dc1ac"

      - name: Install pinned runtime dependencies
        run: python -m pip install "rich==15.0.0" "typer==0.27.0"

      - name: Run FolioLint
        run: foliolint scan . --format markdown --output foliolint-report.md --fail-under 75

      - name: Add report to job summary
        if: always()
        run: Get-Content foliolint-report.md >> $env:GITHUB_STEP_SUMMARY
        shell: pwsh
