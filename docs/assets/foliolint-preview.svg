<svg viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FolioLint terminal preview</title>
  <desc id="desc">Example FolioLint scan output with score, status and check results.</desc>
  <style>
    .bg { fill: #0d1117; }
    .frame { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .bar { fill: #21262d; }
    .text { fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 18px; }
    .muted { fill: #8b949e; }
    .accent { fill: #58a6ff; font-weight: 700; }
    .ok { fill: #3fb950; font-weight: 700; }
    .rule { stroke: #30363d; stroke-width: 1; }
  </style>

  <rect class="bg" width="980" height="520" rx="8"/>
  <rect class="frame" x="28" y="28" width="924" height="464" rx="8"/>
  <rect class="bar" x="28" y="28" width="924" height="44" rx="8"/>
  <rect class="bar" x="28" y="58" width="924" height="14"/>
  <text class="text muted" x="54" y="56">foliolint scan . --explain</text>

  <text class="text" x="54" y="108" font-weight="700">FolioLint</text>
  <text class="text muted" x="54" y="144">Path:</text>
  <text class="text" x="120" y="144">./FolioLint</text>
  <text class="text muted" x="54" y="180">Score:</text>
  <text class="text accent" x="130" y="180">96/100</text>
  <text class="text muted" x="54" y="216">Status:</text>
  <text class="text ok" x="140" y="216">Showcase-ready</text>

  <line class="rule" x1="54" y1="246" x2="926" y2="246"/>
  <text class="text muted" x="54" y="280">Category</text>
  <text class="text muted" x="220" y="280">Status</text>
  <text class="text muted" x="350" y="280">Notes</text>
  <line class="rule" x1="54" y1="300" x2="926" y2="300"/>

  <text class="text" x="54" y="332">README</text>
  <text class="text ok" x="220" y="332">OK</text>
  <text class="text" x="350" y="332">Purpose, setup, usage and tests found</text>

  <text class="text" x="54" y="366">License</text>
  <text class="text ok" x="220" y="366">OK</text>
  <text class="text" x="350" y="366">License file found</text>

  <text class="text" x="54" y="400">Media</text>
  <text class="text ok" x="220" y="400">OK</text>
  <text class="text" x="350" y="400">Screenshot or demo media hint found</text>

  <text class="text" x="54" y="434">Hygiene</text>
  <text class="text ok" x="220" y="434">OK</text>
  <text class="text" x="350" y="434">No common hygiene issues found</text>

  <text class="text" x="54" y="468">Secrets</text>
  <text class="text ok" x="220" y="468">OK</text>
  <text class="text" x="350" y="468">No obvious secret patterns found</text>
</svg>
